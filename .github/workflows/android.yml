name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Android packages
        run: sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Configure Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Create Android debug keystore
        run: |
          mkdir -p ~/.android
          "$JAVA_HOME/bin/keytool" -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate project
        run: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --verbose --export-debug "Android" build/RecRoomClassics-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecRoomClassics-debug-apk
          path: build/RecRoomClassics-debug.apk
          if-no-files-found: error
          retention-days: 14
